plugins {
        id 'com.android.application' version '8.7.3'
        }

        android {
            namespace 'com.fullscreenhtml'
                compileSdk 35
                    defaultConfig {
                            applicationId 'com.fullscreenhtml'
                                    minSdk 21
                                            targetSdk 35
                                                    versionCode 1
                                                            versionName '1.0'
                                                                }
                                                                    compileOptions {
                                                                            sourceCompatibility JavaVersion.VERSION_17
                                                                                    targetCompatibility JavaVersion.VERSION_17
                                                                                        }
                                                                                        }
